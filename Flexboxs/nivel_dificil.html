<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nível Difícil – Painel Administrativo</title>

  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-w: 200px;
      --header-h: 54px;
      --footer-h: 40px;
      --bg-dark: #1a1f2e;
      --bg-darker: #131720;
      --bg-content: #f0f2f7;
      --accent: #4f8ef7;
      --accent2: #e94f6a;
      --text-light: #c9d1e8;
      --text-muted: #7a88ab;
      --card-bg: #ffffff;
      --font-heading: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-content);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      flex-direction: row;                           
      align-items: center;
      justify-content: space-between;
      background: var(--bg-darker);
      height: var(--header-h);
      padding: 0 24px;
      flex-shrink: 0;                 /* não encolhe */
      z-index: 10;
      box-shadow: 0 2px 12px rgba(0,0,0,.4);
    }

    .logo {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .logo span { color: var(--accent2); }

    header nav {
      display: flex;
      flex-direction: row;
      gap: 8px;
    }

    header nav a {
      color: var(--text-light);
      text-decoration: none;
      font-size: .85rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      transition: background .2s, color .2s;
    }
    header nav a:hover { background: var(--accent); color: #fff; }
    header nav a.sair { color: var(--accent2); }
    header nav a.sair:hover { background: var(--accent2); color: #fff; }


    .wrapper {
      display: flex;
      flex-direction: row;
      flex-grow: 1;         
      overflow: hidden;
    }

    aside {
      display: flex;
      flex-direction: column;  /* itens empilhados verticalmente */
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--bg-dark);
      padding: 28px 0 20px;
      overflow-y: auto;
    }

    aside .section-label {
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0 20px 10px;
    }

    aside nav {
      display: flex;
      flex-direction: column; /* lista de navegação vertical */
      gap: 2px;
    }

    aside nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-light);
      text-decoration: none;
      font-size: .875rem;
      padding: 11px 20px;
      border-left: 3px solid transparent;
      transition: background .2s, border-color .2s, color .2s;
    }

    aside nav a:hover,
    aside nav a.active {
      background: rgba(79,142,247,.12);
      border-left-color: var(--accent);
      color: #fff;
    }

    aside nav a .icon {
      font-size: 1rem;
      width: 18px;
      text-align: center;
    }

  
    main {
      flex-grow: 1;        /* ocupa o restante do espaço ao lado da sidebar */
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 28px 28px 0;
      gap: 20px;
    }

    .page-title {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 700;
      color: #2a2f45;
      flex-shrink: 0;
    }
    .page-title span { color: var(--accent); }


    .cards-container {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;        /* quebra linha quando não cabe */
      gap: 18px;
      align-content: flex-start;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 22px 20px;
      box-shadow: 0 2px 16px rgba(0,0,0,.07);
      flex: 1 1 200px;        /* cresce e encolhe; base mínima 200px */
      min-width: 160px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform .2s, box-shadow .2s;
      cursor: default;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(79,142,247,.18);
    }

    .card:nth-child(1) { border-top: 3px solid #4f8ef7; }
    .card:nth-child(2) { border-top: 3px solid #e94f6a; }
    .card:nth-child(3) { border-top: 3px solid #22c9a0; }
    .card:nth-child(4) { border-top: 3px solid #f7934f; }
    .card:nth-child(5) { border-top: 3px solid #9b5de5; }
    .card:nth-child(6) { border-top: 3px solid #f7c84f; }

    .card-title {
      font-family: var(--font-heading);
      font-size: .95rem;
      font-weight: 700;
      color: #2a2f45;
    }


    footer {
      display: flex;
      align-items: center;
      justify-content: center;   
      height: var(--footer-h);
      background: var(--bg-darker);
      color: var(--text-muted);
      font-size: .75rem;
      flex-shrink: 0;
      letter-spacing: .5px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">LOGO</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Perfil</a>
      <a href="#" class="sair">Sair</a>
    </nav>
  </header>


  <div class="wrapper">

    <aside>
      <p class="section-label">Menu</p>
      <nav>
        <a class="active">Dashboard</a>
        <a>Usuários</a>
        <a>Relatórios</a>
        <a>Configurações</a>
      </nav>
    </aside>

    <main>
      <h1 class="page-title">Dashboard <span>/ Visão Geral</span></h1>

      <div class="cards-container">

        <div class="card">
          <div class="card-title">CARD 1</div>
        </div>

        <div class="card">
          <div class="card-title">CARD 2</div>
        </div>

        <div class="card">
          <div class="card-title">CARD 3</div>
        </div>

        <div class="card">
          <div class="card-title">CARD 4</div>
        </div>

        <div class="card">
          <div class="card-title">CARD 5</div>
        </div>

        <div class="card">
          <div class="card-title">CARD 6</div>
        </div>

      </div>
    </main>
  </div>

</body>
</html>
